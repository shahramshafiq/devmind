# Render Blueprint: free web service for the DevMind backend.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: devmind-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
